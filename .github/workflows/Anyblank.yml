name: Windows Cloud PC - Anydesk (Otimizado)

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciar Construção...
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Baixando e Instalando o Essentials
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1" -OutFile "Downloads.bat"
          cmd /c Downloads.bat

      - name: Entrar no AnyDesk
        shell: powershell
        run: |
          if (Test-Path "start.bat") {
            cmd /c start.bat
          } elseif (Test-Path "iniciar.bat") {
            cmd /c iniciar.bat
          } else {
            Write-Host "Arquivo de inicializacao não encontrado. Verifique a configuração."
          }

      - name: Monitorar e reiniciar o AnyDesk, se necessário
        shell: powershell
        run: |
          while ($true) {
            $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $process) {
              Write-Host "AnyDesk não está rodando, reiniciando..."
              if (Test-Path "start.bat") { cmd /c start.bat }
              elseif (Test-Path "iniciar.bat") { cmd /c iniciar.bat }
            }
            Start-Sleep -Seconds 300
          }

      - name: Contador de Tempo (Tarefa de Longa Duração)
        shell: powershell
        run: |
          Start-Sleep -Seconds 604800

      - name: Limpar arquivos temporários
        if: success()
        shell: powershell
        run: |
          if (Test-Path "Downloads.bat") {
            Remove-Item Downloads.bat -Force
          }
          Write-Host "Limpeza completa."
