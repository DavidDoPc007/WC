name: Windows Cloud PC - AnyDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Windows
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Install AnyDesk
        shell: powershell
        run: |
          $installer = "$env:TEMP\AnyDesk.exe"

          Write-Host "Baixando AnyDesk..."

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            Write-Error "Falha ao baixar o AnyDesk."
            exit 1
          }

          Write-Host "Instalando AnyDesk..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "--install `"C:\Program Files (x86)\AnyDesk`" --start-with-win" `
            -Wait

          Start-Sleep -Seconds 10

          Write-Host "Instalação concluída."

      - name: Find AnyDesk
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe"
          )

          $anydesk = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (!$anydesk) {
            Write-Error "AnyDesk.exe não encontrado."
            exit 1
          }

          Write-Host "AnyDesk encontrado em:"
          Write-Host $anydesk

          "ANYDESK_PATH=$anydesk" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      - name: Start AnyDesk
        shell: powershell
        run: |
          Write-Host "Iniciando AnyDesk..."

          Start-Process -FilePath "$env:ANYDESK_PATH"

          Start-Sleep -Seconds 15

          $process = Get-Process -Name "AnyDesk" `
            -ErrorAction SilentlyContinue

          if (!$process) {
            Write-Error "AnyDesk não iniciou."
            exit 1
          }

          Write-Host "AnyDesk está rodando."

      - name: Get AnyDesk ID
        shell: powershell
        run: |
          Write-Host "Obtendo ID do AnyDesk..."

          $id = & "$env:ANYDESK_PATH" --get-id 2>$null

          if ($id) {
            Write-Host ""
            Write-Host "========================================"
            Write-Host "        ANYDESK ID"
            Write-Host "========================================"
            Write-Host $id
            Write-Host "========================================"
            Write-Host ""
          }
          else {
            Write-Host "O comando --get-id não retornou um ID."
            Write-Host "Verificando arquivos de configuração..."

            $configPaths = @(
              "$env:APPDATA\AnyDesk\system.conf",
              "C:\ProgramData\AnyDesk\system.conf"
            )

            foreach ($config in $configPaths) {
              if (Test-Path $config) {
                Write-Host "Configuração encontrada: $config"

                $content = Get-Content $config -ErrorAction SilentlyContinue

                $match = $content |
                  Select-String "ad\.anynet\.id|ad\.anynet\.alias"

                if ($match) {
                  $match | ForEach-Object {
                    Write-Host $_.Line
                  }
                }
              }
            }
          }

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Windows runner ativo."
          Write-Host "Tempo máximo configurado: 6 horas."
          Write-Host "========================================"

          Start-Sleep -Seconds 21000
