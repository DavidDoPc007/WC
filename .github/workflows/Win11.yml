name: Windows Cloud PC - AnyDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Windows
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Install AnyDesk
        shell: powershell
        run: |
          $installer = "$env:TEMP\AnyDesk.exe"

          Write-Host "Baixando AnyDesk..."

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "Falha ao baixar o AnyDesk."
          }

          Write-Host "Instalando AnyDesk..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList '--install "C:\Program Files (x86)\AnyDesk" --start-with-win' `
            -Wait

          Start-Sleep -Seconds 10

      - name: Find AnyDesk
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe"
          )

          $anydesk = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (!$anydesk) {
            throw "AnyDesk.exe não encontrado."
          }

          Write-Host "AnyDesk encontrado:"
          Write-Host $anydesk

          "ANYDESK_PATH=$anydesk" >> $env:GITHUB_ENV

      - name: Set AnyDesk Password
        shell: powershell
        run: |
          Write-Host "Definindo senha do AnyDesk..."
          echo "Anydeskgem152" | & "$env:ANYDESK_PATH" --set-password

      - name: Start AnyDesk
        shell: powershell
        run: |
          Write-Host "Iniciando AnyDesk..."

          Start-Process -FilePath "$env:ANYDESK_PATH"

          Start-Sleep -Seconds 15

          $process = Get-Process -Name "AnyDesk" `
            -ErrorAction SilentlyContinue

          if (!$process) {
            throw "AnyDesk não iniciou."
          }

          Write-Host "AnyDesk está rodando."

      - name: Get AnyDesk ID
        shell: powershell
        run: |
          Write-Host "Obtendo ID do AnyDesk..."

          $configPaths = @(
            "$env:APPDATA\AnyDesk\system.conf",
            "C:\ProgramData\AnyDesk\system.conf"
          )

          $id = $null

          foreach ($config in $configPaths) {

            if (Test-Path $config) {

              Write-Host "Verificando:"
              Write-Host $config

              $line = Get-Content $config -ErrorAction SilentlyContinue |
                Select-String "^ad\.anynet\.id=" |
                Select-Object -First 1

              if ($line) {
                $id = ($line.Line -split "=", 2)[1].Trim()
                break
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($id)) {

            Write-Host "ID não encontrado no system.conf."
            Write-Host "Tentando --get-id..."

            $result = & "$env:ANYDESK_PATH" --get-id 2>$null

            if ($result) {
              $id = $result.Trim()
            }
          }

          if ([string]::IsNullOrWhiteSpace($id)) {
            throw "Não foi possível obter o ID do AnyDesk."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          ANYDESK ID"
          Write-Host "========================================"
          Write-Host $id
          Write-Host "========================================"
          Write-Host ""

      - name: Check AnyDesk Process
        shell: powershell
        run: |
          $process = Get-Process -Name "AnyDesk" `
            -ErrorAction SilentlyContinue

          if ($process) {
            Write-Host "AnyDesk está funcionando."
          }
          else {
            throw "Processo AnyDesk não encontrado."
          }

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Runner ativo."
          Write-Host "Limite configurado: 6 horas."

          Start-Sleep -Seconds 21000
