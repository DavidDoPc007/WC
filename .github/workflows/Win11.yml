name: Windows Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Baixar AnyDesk
        shell: powershell
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $file = "$env:TEMP\AnyDesk.exe"

          Invoke-WebRequest -Uri $url -OutFile $file

          if (!(Test-Path $file)) {
            throw "Falha ao baixar AnyDesk."
          }

          Write-Host "AnyDesk baixado."

      - name: Instalar AnyDesk
        shell: powershell
        run: |
          $file = "$env:TEMP\AnyDesk.exe"

          Start-Process `
            -FilePath $file `
            -ArgumentList '--install "C:\Program Files (x86)\AnyDesk" --start-with-win' `
            -Wait

          Start-Sleep -Seconds 10

      - name: Localizar AnyDesk
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe"
          )

          $anydesk = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (!$anydesk) {
            throw "AnyDesk.exe não encontrado."
          }

          "ANYDESK=$anydesk" >> $env:GITHUB_ENV

          Write-Host "Executável:"
          Write-Host $anydesk

      - name: Iniciar AnyDesk
        shell: powershell
        run: |
          Start-Process "$env:ANYDESK"

          Start-Sleep -Seconds 15

          $p = Get-Process AnyDesk -ErrorAction SilentlyContinue

          if (!$p) {
            throw "AnyDesk não está rodando."
          }

          Write-Host "AnyDesk iniciado."

      - name: Obter ID
        shell: powershell
        run: |
          $id = & "$env:ANYDESK" --get-id 2>$null

          if ($id) {
            Write-Host ""
            Write-Host "=============================="
            Write-Host "ANYDESK ID: $id"
            Write-Host "=============================="
          }
          else {
            Write-Host "Não foi possível obter o ID."
          }

      - name: Verificar credenciais
        shell: powershell
        env:
          PC_PASSWORD: ${{ secrets.PC_PASSWORD }}
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          if (!$env:PC_PASSWORD) {
            throw "PC_PASSWORD não configurado."
          }

          if (!$env:ANYDESK_PASSWORD) {
            throw "ANYDESK_PASSWORD não configurado."
          }

          Write-Host "Usuário Windows: CloudUser"
          Write-Host "As senhas estão protegidas pelos GitHub Secrets."

      - name: Manter execução
        shell: powershell
        run: |
          Start-Sleep -Seconds 21000
