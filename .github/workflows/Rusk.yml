name: Windows Cloud PC - RustDesk

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Windows (RustDesk)
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Install RustDesk Silently
        shell: powershell
        run: |
          $installer = "$env:TEMP\rustdesk.exe"
          Write-Host "Baixando RustDesk..."
          
          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.exe" `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "Falha ao baixar o instalador."
          }

          Write-Host "Instalando em segundo plano..."
          Start-Process -FilePath $installer -ArgumentList "--silent-install" -Wait
          
          Start-Sleep -Seconds 5

      - name: Configure Password and Find Path
        shell: powershell
        run: |
          $rustdeskPath = "C:\Program Files\RustDesk\rustdesk.exe"

          if (!(Test-Path $rustdeskPath)) {
            throw "RustDesk não foi instalado corretamente."
          }

          Write-Host "Definindo senha permanente..."
          & "$rustdeskPath" --password Anydeskgem152

          Write-Host "RUSTDESK_PATH=$rustdeskPath" >> $env:GITHUB_ENV
          Write-Host "Configuração concluída com sucesso!"

      - name: Get RustDesk ID
        shell: powershell
        run: |
          Write-Host "Obtendo ID do RustDesk..."
          
          $idFile = "$env:APPDATA\RustDesk\config\rustdesk.toml"
          $id = $null

          for ($i=0; $i -lt 5; $i++) {
            if (Test-Path $idFile) {
              $content = Get-Content $idFile -Raw
              if ($content -match 'id\s*=\s*"([^"]+)"') {
                $id = $matches[1]
                break
              }
            }
            Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($id)) {
            $result = & "C:\Program Files\RustDesk\rustdesk.exe" --get-id 2>$null
            if ($result) {
              $id = $result.Trim()
            }
          }

          if ([string]::IsNullOrWhiteSpace($id)) {
            throw "Não foi possível capturar o ID."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "         RUSTDESK ID: $id"
          Write-Host "========================================"
          Write-Host ""

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Runner ativo por 6 horas."
          Start-Sleep -Seconds 21000
