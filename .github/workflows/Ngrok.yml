name: Windows Cloud PC - RDP Ngrok

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Windows RDP
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Ativar RDP no Windows
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "RDP ativado com sucesso!"

      - name: Definir Senha do Administrador
        shell: powershell
        run: |
          $account = [adsi] "WinNT://$env:COMPUTERNAME/runneradmin,user"
          $account.SetPassword("Anydeskgem152")
          Write-Host "Senha alterada com sucesso para: Anydeskgem152"

      - name: Instalar e Iniciar Ngrok
        shell: powershell
        run: |
          Write-Host "Baixando Ngrok..."
          $ngrokZip = "$env:TEMP\ngrok.zip"
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile $ngrokZip
          Expand-Archive -Path $ngrokZip -DestinationPath "C:\ProgramData" -Force

          Write-Host "Abrindo túnel TCP na porta padrão do RDP (3389)..."
          Start-Process -FilePath "C:\ProgramData\ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 5

      - name: Obter Endereço de Acesso RDP
        shell: powershell
        run: |
          try {
            $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
            $tunnelUrl = $response.tunnels[0].public_url
            Write-Host ""
            Write-Host "=================================================="
            Write-Host " DADOS PARA CONEXÃO RDP:"
            Write-Host " Endereço: $tunnelUrl"
            Write-Host " Usuário: runneradmin"
            Write-Host " Senha: Anydeskgem152"
            Write-Host "=================================================="
            Write-Host ""
          } catch {
            Write-Host "Não foi possível pegar a URL via API, verifique o painel do Ngrok se necessário."
          }

      - name: Manter Runner Ativo
        shell: powershell
        run: |
          Write-Host "PC na nuvem pronto e ativo por 6 horas."
          Start-Sleep -Seconds 21000
